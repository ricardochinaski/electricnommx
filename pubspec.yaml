name: nom_electrica_mx
description: "NOM Electrica MX - Normativa electrica mexicana (NOM-001-SEDE), calculadoras tecnicas y asistente IA para electricistas de Mexico."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  share_plus: ^12.0.2
  intl: ^0.19.0
  syncfusion_flutter_pdfviewer: ^27.1.51
  syncfusion_flutter_pdf: ^27.2.5
  shared_preferences: ^2.5.5
  path_provider: ^2.1.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: 6.2.1
  cloud_firestore: ^6.3.0
  flutter_dotenv: ^6.0.1
  google_mobile_ads: ^8.0.0
  purchases_flutter: ^10.4.2
  provider: ^6.1.5+1
  pdf: ^3.12.0
  printing: ^5.14.3
  package_info_plus: ^9.0.1
  app_tracking_transparency: ^2.0.7
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/pdfs/
    - assets/icon/
    - "assets/Pliegos RPTD/"
    - assets/rag/
